# ==============================================================================
# MODSECURITY v3 MASTER DEFENSE SUITE — SCOPE_WEB
# Áp dụng cho: Node.js / JavaScript Web Ecosystem, Python Backend (FastAPI / Django / Flask)
# Các mối đe dọa tổng hợp: CVE-2016-15042, CVE-2017-7921, CVE-2019-11510, CVE-2019-9879
# Tự động đồng bộ bởi OpenClaw CTI Defense Orchestrator
# ==============================================================================

# Vector 1: Chống Remote Code Execution (RCE) & Command Injection
SecRule REQUEST_URI|REQUEST_BODY|ARGS "@rx (?i)(?:;|\||`|\$\(|\/bin\/sh|\/bin\/bash|cmd\.exe|powershell|system\(|exec\(|eval\(|child_process)" \
    "id:2026001,phase:2,deny,status:403,log,msg:'[MASTER-WAF] Blocked Command Injection / RCE Attempt',tag:'attack-rce',severity:'CRITICAL'"

# Vector 2: Chống SQL Injection (SQLi)
SecRule REQUEST_URI|REQUEST_BODY|ARGS "@rx (?i)(?:union\s+select|select\s+.*\s+from|insert\s+into|benchmark\(|sleep\(\d+\)|waitfor\s+delay|--|\#|\/\*)" \
    "id:2026002,phase:2,deny,status:403,log,msg:'[MASTER-WAF] Blocked SQL Injection Pattern',tag:'attack-sqli',severity:'CRITICAL'"

# Vector 3: Chống Scanner-Evading JavaScript & XSS Injection (CVE-2016-15042)
SecRule REQUEST_URI|REQUEST_BODY|ARGS "@rx (?i)(?:<script|javascript:|unescape\(|String\.fromCharCode|document\.cookie|document\.location|window\.location)" \
    "id:2026003,phase:2,deny,status:403,log,msg:'[MASTER-WAF] Blocked Malicious Script / XSS Evasion Pattern',tag:'attack-xss',severity:'CRITICAL'"

# Vector 4: Chống Server-Side Request Forgery (SSRF) & Path Traversal
SecRule REQUEST_URI|REQUEST_BODY|ARGS "@rx (?i)(?:\.\.\/|\.\.\\|169\.254\.169\.254|localhost|127\.0\.0\.1|metadata\.google\.internal)" \
    "id:2026004,phase:2,deny,status:403,log,msg:'[MASTER-WAF] Blocked SSRF or Path Traversal Probe',tag:'attack-ssrf',severity:'HIGH'"
