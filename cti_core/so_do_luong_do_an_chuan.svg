<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" width="100%" height="100%" style="background:#131316; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60606c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    
    <!-- Card shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="500" y="38" text-anchor="middle" fill="#f4f4f6" font-size="16" font-weight="700" letter-spacing="0.5">SƠ ĐỒ KIẾN TRÚC & LUỒNG THỰC THI HỆ THỐNG AN NINH MẠNG TÁC TỬ TỰ HÀNH</text>
  <text x="500" y="58" text-anchor="middle" fill="#8e8e98" font-size="12">Mô hình tích hợp Tình báo CTI Đa Nguồn, Thẩm định xAI Dual-Loop và Đóng gói Kỹ năng cho 15 Nền tảng AI Agent</text>

  <!-- ==================== KHỐI 1 ==================== -->
  <g id="block1">
    <!-- Container -->
    <rect x="180" y="80" width="640" height="135" rx="8" fill="#1c1c21" stroke="#2d2d35" stroke-width="1.2"/>
    <text x="200" y="104" fill="#9ca3af" font-size="12" font-weight="600">1. Thu Thập &amp; Lưu Trữ Tình Báo An Ninh Mạng (Multi-Source CTI Ingestion)</text>
    
    <!-- Node 1.1 -->
    <rect x="205" y="118" width="590" height="38" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="142" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="500">Nguồn tin OSINT: The Hacker News, BleepingComputer, CISA KEV, Abuse.ch, SecurityWeek</text>

    <!-- Node 1.2 -->
    <rect x="205" y="166" width="590" height="38" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="190" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="500">Lưu trữ toàn văn nguyên bản (Verbatim) vào SQLite &amp; băm SHA-256 xác thực toàn vẹn</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="500" y1="215" x2="500" y2="245" stroke="#60606c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== KHỐI 2 ==================== -->
  <g id="block2">
    <!-- Container -->
    <rect x="180" y="245" width="640" height="185" rx="8" fill="#1c1c21" stroke="#2d2d35" stroke-width="1.2"/>
    <text x="200" y="269" fill="#9ca3af" font-size="12" font-weight="600">2. Tác Tử CTI Phân Tích &amp; Rà Quét Ngữ Cảnh Dự Án (CTI Intelligence &amp; Codebase Scanner)</text>

    <!-- Node 2.1 -->
    <rect x="205" y="283" width="590" height="38" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="307" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="500">Quét cây AST mã nguồn dự án đích: Nhận diện ngôn ngữ &amp; định vị Sensitive Sinks (exec, eval, sql)</text>

    <!-- Node 2.2 -->
    <rect x="205" y="331" width="590" height="38" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="355" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="500">Bóc tách chỉ báo thỏa hiệp (IOCs), mã CVE và ánh xạ kỹ thuật MITRE ATT&amp;CK / D3FEND</text>

    <!-- Node 2.3 -->
    <rect x="205" y="379" width="590" height="38" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="403" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="500">Lọc bỏ 100% CTI không liên quan theo Tech Stack, xác lập Phân hệ (SCOPE_WEB, SCOPE_API...)</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="500" y1="430" x2="500" y2="460" stroke="#60606c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== KHỐI 3 ==================== -->
  <g id="block3">
    <!-- Container -->
    <rect x="180" y="460" width="640" height="185" rx="8" fill="#1c1c21" stroke="#2d2d35" stroke-width="1.2"/>
    <text x="200" y="484" fill="#9ca3af" font-size="12" font-weight="600">3. Hạt Nhân Thẩm Định xAI &amp; Hộp Cát Kiểm Toán Đối Kháng (xAI Dual-Loop &amp; Sandbox Gate)</text>

    <!-- Node 3.1 -->
    <rect x="205" y="498" width="590" height="38" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="522" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="500">Đối soát chuỗi nguyên bản &amp; tọa độ ký tự triệt tiêu ảo giác (Zero-Hallucination Grounding)</text>

    <!-- Node 3.2 -->
    <rect x="205" y="546" width="590" height="38" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="570" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="500">Bộ lọc an toàn Fail-Safe: Whitelist DNS công cộng (8.8.8.8, 1.1.1.1) và dải IP nội bộ RFC1918</text>

    <!-- Node 3.3 -->
    <rect x="205" y="594" width="590" height="38" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="618" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="500">Kiểm thử cú pháp mã Python trong hộp cát cô lập 5 giây &amp; Tính điểm Trust Score (&gt; 90/100)</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="500" y1="645" x2="500" y2="675" stroke="#60606c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== KHỐI 4 ==================== -->
  <g id="block4">
    <!-- Container -->
    <rect x="180" y="675" width="640" height="215" rx="8" fill="#1c1c21" stroke="#2d2d35" stroke-width="1.2"/>
    <text x="200" y="699" fill="#9ca3af" font-size="12" font-weight="600">4. Cổng Kiểm Soát An Toàn (Safety Control Gate)</text>

    <!-- Decision Diamond -->
    <polygon points="500,715 620,775 500,835 380,775" fill="#282830" stroke="#484856" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="500" y="771" text-anchor="middle" fill="#f4f4f6" font-size="13" font-weight="600">Phê duyệt: approved?</text>
    <text x="500" y="787" text-anchor="middle" fill="#9ca3af" font-size="10.5">(Trust Score &ge; 80 / 100)</text>

    <!-- Branch Left: Chưa phê duyệt -->
    <line x1="380" y1="775" x2="270" y2="775" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="270" y1="775" x2="270" y2="825" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <rect x="200" y="825" width="140" height="16" fill="#1c1c21"/>
    <text x="270" y="805" text-anchor="middle" fill="#ef4444" font-size="10.5" font-weight="600">Chưa phê duyệt</text>

    <!-- Blocked Box -->
    <rect x="205" y="830" width="170" height="42" rx="6" fill="#241414" stroke="#7f1d1d" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="290" y="848" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">Khóa thực thi an toàn</text>
    <text x="290" y="863" text-anchor="middle" fill="#f87171" font-size="10">BLOCKED &amp; Passive Audit</text>

    <!-- Branch Down: Đã phê duyệt -->
    <line x1="500" y1="835" x2="500" y2="920" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <rect x="460" y="860" width="80" height="18" rx="4" fill="#14281a" stroke="#166534" stroke-width="1"/>
    <text x="500" y="873" text-anchor="middle" fill="#4ade80" font-size="10.5" font-weight="700">Đã phê duyệt</text>
  </g>

  <!-- ==================== KHỐI 5 ==================== -->
  <g id="block5">
    <!-- Container -->
    <rect x="120" y="920" width="760" height="380" rx="8" fill="#1c1c21" stroke="#2d2d35" stroke-width="1.2"/>
    <text x="140" y="944" fill="#9ca3af" font-size="12" font-weight="600">5. Tác Tử Phòng Thủ Tự Hành &amp; Tự Động Vá Mã Nguồn (Agentic Defense Skills Hub &amp; Remediation)</text>

    <!-- Top Card: Nạp Kỹ Năng Chuẩn Mở -->
    <rect x="145" y="960" width="710" height="42" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="978" text-anchor="middle" fill="#f3f4f6" font-size="12.5" font-weight="600">Đóng gói Kỹ Năng Tác Tử Độc Lập (Chuẩn Open Agent Protocol / RFC): SKILL.md, manifest.json, verify_exploit.py</text>
    <text x="500" y="994" text-anchor="middle" fill="#9ca3af" font-size="11">Tự động nạp vào 15 Nền tảng: Claude Code (.claude/skills/), Cursor (.cursor/rules/), Antigravity (.gemini/skills/), Codex, Copilot...</text>

    <!-- Connecting line from top card to 3 sub-cards -->
    <line x1="500" y1="1002" x2="500" y2="1030" stroke="#60606c" stroke-width="1.5"/>
    <line x1="260" y1="1030" x2="740" y2="1030" stroke="#60606c" stroke-width="1.5"/>
    <line x1="260" y1="1030" x2="260" y2="1050" stroke="#60606c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="500" y1="1030" x2="500" y2="1050" stroke="#60606c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="740" y1="1030" x2="740" y2="1050" stroke="#60606c" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Sub-card 1: Sửa mã nguồn -->
    <rect x="145" y="1050" width="230" height="90" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="260" y="1076" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="700">Tự Động Vá Mã Nguồn</text>
    <text x="260" y="1098" text-anchor="middle" fill="#cbd5e1" font-size="11">AI Agent đọc SOP &amp; Fixture</text>
    <text x="260" y="1116" text-anchor="middle" fill="#cbd5e1" font-size="11">Sửa tận gốc Sink nhạy cảm</text>
    <text x="260" y="1132" text-anchor="middle" fill="#94a3b8" font-size="10.5">(PHP, Node.js, Python AST)</text>

    <!-- Sub-card 2: Lá chắn ảo hóa -->
    <rect x="385" y="1050" width="230" height="90" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="500" y="1076" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="700">Kích Hoạt Lá Chắn Ảo Hóa</text>
    <text x="500" y="1098" text-anchor="middle" fill="#cbd5e1" font-size="11">scripts/apply_virtual_patch.py</text>
    <text x="500" y="1116" text-anchor="middle" fill="#cbd5e1" font-size="11">WAF Reverse Proxy (Cổng 8766)</text>
    <text x="500" y="1132" text-anchor="middle" fill="#94a3b8" font-size="10.5">Chặn nóng Payload L7 &amp; C2 IP</text>

    <!-- Sub-card 3: Kiểm chứng thực nghiệm -->
    <rect x="625" y="1050" width="230" height="90" rx="6" fill="#26262d" stroke="#3b3b46" stroke-width="1" filter="url(#shadow)"/>
    <text x="740" y="1076" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="700">Kiểm Chứng Thực Nghiệm</text>
    <text x="740" y="1098" text-anchor="middle" fill="#cbd5e1" font-size="11">scripts/verify_exploit.py</text>
    <text x="740" y="1116" text-anchor="middle" fill="#cbd5e1" font-size="11">Tự động bắn probe kiểm thử</text>
    <text x="740" y="1132" text-anchor="middle" fill="#94a3b8" font-size="10.5">Xác nhận Zero Vulnerability (0%)</text>

    <!-- Connecting line to bottom telemetry -->
    <line x1="260" y1="1140" x2="260" y2="1170" stroke="#60606c" stroke-width="1.5"/>
    <line x1="500" y1="1140" x2="500" y2="1170" stroke="#60606c" stroke-width="1.5"/>
    <line x1="740" y1="1140" x2="740" y2="1170" stroke="#60606c" stroke-width="1.5"/>
    <line x1="260" y1="1170" x2="740" y2="1170" stroke="#60606c" stroke-width="1.5"/>
    <line x1="500" y1="1170" x2="500" y2="1195" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <!-- Bottom Telemetry & Audit Box (Green Accent) -->
    <rect x="145" y="1195" width="710" height="85" rx="6" fill="#14281a" stroke="#22c55e" stroke-width="1.3" filter="url(#shadow)"/>
    <text x="500" y="1225" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">Màn Hình Telemetry &amp; Nhật Ký Kiểm Toán Tác Tử Thời Gian Thực (Audit Trail)</text>
    <text x="500" y="1248" text-anchor="middle" fill="#bbf7d0" font-size="11.5">Ghi nhận minh chứng đối sánh: Trước khi vá (Vulnerable 100%) &rarr; Sau khi nạp Skill (Hardened &amp; Patched 100%)</text>
    <text x="500" y="1266" text-anchor="middle" fill="#86efac" font-size="11">Lưu trữ bằng chứng số nguyên bản: xai_audit_trail.json, SHA-256 đối soát mã nguồn và biên bản bàn giao DevSecOps</text>
  </g>
</svg>
